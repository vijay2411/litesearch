[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litesearch"
version = "0.1.0"
description = "Pluggable semantic search over SQLite — BM25 + vector + hybrid, with reranking and time decay."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Vedant Vijay", email = "vedant@mugyen.com" }]
keywords = ["search", "semantic-search", "sqlite", "embeddings", "bm25", "hybrid-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "sqlite-vec>=0.1.1",
    "python-frontmatter>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
ollama = ["ollama>=0.3"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
gemini = ["google-genai>=1.0"]
all = ["litesearch[ollama,server,gemini]"]

[project.scripts]
litesearch = "litesearch.__main__:main"

[project.urls]
Homepage = "https://github.com/vedantvijay/litesearch"
Repository = "https://github.com/vedantvijay/litesearch"
